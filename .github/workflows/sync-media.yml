name: Sync EnterXera Media (Shard 1)

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run media sync
        run: npm run sync

      - name: Commit & Push changes
        run: |
          git config user.name "enterxera-bot"
          git config user.email "bot@enterxera.com"
          git add posters/ banners/ backdrops/ logos/ avatars/
          if git diff --staged --quiet; then
            echo "No new media to commit."
          else
            git commit -m "chore(media): sync shard 1 assets"
            git push
          fi
